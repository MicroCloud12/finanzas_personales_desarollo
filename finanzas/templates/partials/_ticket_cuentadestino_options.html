<option value="N/A" {% if not ticket.sug.destino %}selected{% endif %}>N/A</option>
{% for cuenta in cuentas_usuario %}
    <option value="{{ cuenta.nombre }}" {% if cuenta.nombre == ticket.sug.destino %}selected{% endif %}>{{ cuenta.nombre }} ({{ cuenta.get_tipo_display }})</option>
{% endfor %}
{% if not tiene_cuenta_ahorro %}
    <option value="__NUEVA_AHORRO__" {% if ticket.sug.destino == '__NUEVA_AHORRO__' %}selected{% endif %}>Cuenta Ahorro (se creará)</option>
{% endif %}
