<option value="">Seleccionar cuenta...</option>
{% for cuenta in cuentas_usuario %}
    <option value="{{ cuenta.nombre }}" {% if cuenta.nombre == ticket.sug.origen %}selected{% endif %}>
        {{ cuenta.nombre }}{% if cuenta.terminacion %} (**{{ cuenta.terminacion }}){% endif %}{% if cuenta.es_pasivo %} · {{ cuenta.get_tipo_display }}{% endif %}
    </option>
{% endfor %}
<option value="Otra Cuenta">Otra Cuenta</option>
