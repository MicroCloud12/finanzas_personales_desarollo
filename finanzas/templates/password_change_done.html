{% extends 'base.html' %}

{% block title %}Contraseña Actualizada | Finanzas Personales{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8 sm:mt-16 text-center">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-5 sm:p-8">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
            <svg class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 font-display mb-2">¡Listo!</h2>
        <p class="text-gray-500 mb-8">Tu contraseña ha sido actualizada exitosamente.</p>

        <a href="{% url 'mi_perfil' %}"
            class="inline-flex justify-center py-2 px-6 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
            Volver a Mi Perfil
        </a>
    </div>
</div>
{% endblock %}
